<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF7F2; }
      .brand-title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 38px;
        fill: #1B2E4B;
      }
      .brand-title-accent {
        fill: #D4714E;
      }
      .brand-subtitle {
        font-family: 'DM Sans', sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #66768A;
      }
      .book-page {
        fill: none;
        stroke: #1B2E4B;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .accent-page {
        fill: none;
        stroke: #D4714E;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Fond Ivoire -->
  <rect width="100%" height="100%" fill="#FAF7F2" rx="8" />

  <g transform="translate(25, 20)">
    <!-- Symbole : Livre ouvert & Jeune pousse du savoir -->
    <path class="book-page" d="M 22 55 C 32 45, 45 45, 55 50 C 65 45, 78 45, 88 55 L 88 75 C 78 65, 65 65, 55 70 C 45 65, 32 65, 22 75 Z" />
    <path class="accent-page" d="M 55 25 L 55 70" />
    <path class="accent-page" d="M 55 25 C 45 35, 35 32, 28 26 C 38 22, 48 24, 55 25 Z" fill="#D4714E" fill-opacity="0.15" />
    <path class="book-page" d="M 55 25 C 65 35, 75 32, 82 26 C 72 22, 62 24, 55 25 Z" />
    <circle cx="55" cy="18" r="3" fill="#D4714E" />

    <!-- Typographie Éditoriale -->
    <text x="105" y="48" class="brand-title">Le Petit <tspan class="brand-title-accent">Cours</tspan></text>
    <text x="106" y="68" class="brand-subtitle">Revue Éditoriale &amp; Scolarité</text>
    <line x1="106" y1="76" x2="430" y2="76" stroke="#E4DDD4" stroke-width="1" />
  </g>
</svg>
